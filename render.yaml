services:
  - type: web
    name: intellect-hub-gateway
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn server.launcher:application --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PINECONE_INDEX_NAME
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: MONGODB_URL
        sync: false
